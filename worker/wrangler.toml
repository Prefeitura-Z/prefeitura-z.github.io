name = "prz-site"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
SITE = "https://prefeitura-z.github.io"

[[d1_databases]]
binding = "DB"
database_name = "prz-site"
database_id = "COLOCADO_PELO_DEPLOY"

# sala do abrigo: jogadores online se veem (WebSocket). Classe com SQLite roda no plano gratuito.
[[durable_objects.bindings]]
name = "ABRIGO"
class_name = "SalaAbrigo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalaAbrigo"]
