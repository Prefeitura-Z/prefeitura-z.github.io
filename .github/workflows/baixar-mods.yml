name: Baixar arquivos de mods (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      pastas:
        description: "Pastas no servidor, separadas por ;"
        required: true
      ext:
        description: "Extensões"
        required: false

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar
        env:
          PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
          PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
          PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
          PTERO_SFTP_PASS: ${{ secrets.PTERO_SFTP_PASS }}
          PASTAS: ${{ inputs.pastas }}
          EXT: ${{ inputs.ext }}
        run: |
          python -m pip install -q paramiko==3.5.0
          python .github/scripts/baixar_mods.py "$RUNNER_TEMP/mods"
      - name: Enviar para a branch "diag-mods"
        run: |
          set -e
          cd "$RUNNER_TEMP/mods"
          git init -q -b diag-mods
          git config user.name "Prefeitura Z"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Arquivos copiados do servidor"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-mods
