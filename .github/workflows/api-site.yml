name: Publicar API do site

# Publica a API (login com Discord + compras) no Cloudflare Workers.
# Roda quando algo muda em worker/ ou pelo botão "Run workflow".
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/api-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir segredos
        id: seg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Segredos CF_API_TOKEN / CF_ACCOUNT_ID ainda não configurados. Nada a fazer."
            echo "pular=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar wrangler
        if: steps.seg.outputs.pular != '1'
        run: npm i -s --no-save wrangler@4.42.0
      - name: Criar/encontrar o banco D1
        if: steps.seg.outputs.pular != '1'
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="prz-site");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create prz-site
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==="prz-site").uuid)})')
          fi
          sed -i "s/COLOCADO_PELO_DEPLOY/$ID/" wrangler.toml
          npx wrangler d1 execute prz-site --remote --file schema.sql -y
      - name: Publicar
        if: steps.seg.outputs.pular != '1'
        # Segredos passados por variável de ambiente: assim caracteres como $ " ` não são alterados pelo shell.
        env:
          S_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          S_DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          S_SITE_BRIDGE_SECRET: ${{ secrets.SITE_BRIDGE_SECRET }}
        run: |
          set -e
          npx wrangler deploy
          printf '%s' "$S_DISCORD_CLIENT_ID" | npx wrangler secret put DISCORD_CLIENT_ID
          printf '%s' "$S_DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
          printf '%s' "$S_SITE_BRIDGE_SECRET" | npx wrangler secret put SITE_BRIDGE_SECRET
