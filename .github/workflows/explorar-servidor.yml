name: Explorar servidor (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      busca:
        description: "Partes do nome dos mods, separadas por vírgula"
        required: false

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listar
        env:
          PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
          PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
          PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
          PTERO_SFTP_PASS: ${{ secrets.PTERO_SFTP_PASS }}
          BUSCA: ${{ inputs.busca }}
        run: |
          python -m pip install -q paramiko==3.5.0
          python .github/scripts/explorar_servidor.py
