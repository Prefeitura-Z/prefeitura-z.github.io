name: Testar site e Depois da Queda
on:
  pull_request:
    paths: ["worker/**", "jogo/**", "mapa/**", ".github/scripts/**", "tests/**", ".github/workflows/eventos-testes.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p test_airdrops.py -v
