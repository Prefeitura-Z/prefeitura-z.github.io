name: Dados do servidor

# A cada 5 minutos (o GitHub às vezes atrasa alguns minutos) e também pelo botão "Run workflow".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-servidor
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler arquivos do servidor e montar dados.json
        id: ler
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_SERVER: ${{ secrets.PTERO_SERVER }}
          PTERO_KEY: ${{ secrets.PTERO_KEY }}
          PTERO_LUA_DIR: ${{ secrets.PTERO_LUA_DIR }}
          PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
          PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
          PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
          PTERO_SFTP_PASS: ${{ secrets.PTERO_SFTP_PASS }}
          SITE_API: https://prz-site.prefeituraz.workers.dev
          SITE_BRIDGE_SECRET: ${{ secrets.SITE_BRIDGE_SECRET }}
        run: |
          if [ -n "$PTERO_SFTP_HOST" ]; then python -m pip install -q paramiko==3.5.0; fi
          python .github/scripts/publicar_dados.py "$RUNNER_TEMP/dados.json"
      - name: Enviar para a branch "dados"
        if: steps.ler.outputs.pular != '1'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q -b dados
          git config user.name "Prefeitura Z"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/dados.json" dados.json
          git add dados.json
          git commit -qm "Dados do servidor"
          # Branch com um único commit, sobrescrito a cada envio: não acumula histórico.
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
