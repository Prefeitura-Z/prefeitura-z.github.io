<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oficina de arte · Depois da Queda</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#171e1b;color:#e4decb}*{box-sizing:border-box}body{margin:0}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #465045;background:#202a24;gap:16px}h1{font-size:18px;margin:0 0 4px;letter-spacing:.1em}p{margin:0;color:#b7b5a1}button,a{font:inherit;color:#e6d6ad;background:#303e33;border:1px solid #64715b;border-radius:5px;padding:9px 14px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#d0ac71;color:#202a24;border-color:#d0ac71}nav{display:flex;gap:8px;flex-wrap:wrap}.area{height:calc(100dvh - 76px);position:relative}#cena{width:100%;height:100%;display:block;outline:none}.hud{position:absolute;left:22px;top:18px;padding:14px 18px;border:1px solid #6b70524d;background:#17241fe8;border-radius:6px;pointer-events:none}.hud b{display:block;color:#e8cd8d;margin-bottom:5px}.rodape{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#15221ee8;padding:8px;border:1px solid #697253;border-radius:8px}.rodape button{display:flex;align-items:center;gap:8px;padding:8px 14px}.rodape img{width:26px;height:26px;image-rendering:pixelated}#aviso{position:absolute;right:20px;top:18px;max-width:310px;padding:12px;background:#1b2b24e8;border:1px solid #7d8965;border-radius:6px;line-height:1.5}#galeria{padding:24px;overflow:auto;height:calc(100dvh - 76px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{padding:18px;background:#242f27;border:1px solid #4a5749;border-radius:8px}.card h3{font-size:14px;text-transform:capitalize}.card canvas{display:block;image-rendering:pixelated;max-width:100%;margin:auto}.card a{display:inline-block;margin-top:12px;font-size:12px}.retratos{width:100%;height:auto;display:block;margin:18px 0}.etiqueta{color:#dcc28b;font-size:12px;letter-spacing:.08em}#dialogo{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:min(680px,94vw);display:flex;gap:18px;background:#202c24f5;border:1px solid #a18b60;border-radius:8px;padding:18px;box-shadow:0 15px 40px #0006}#dialogo[hidden],section[hidden]{display:none!important}#retrato{width:128px;height:128px;object-fit:contain;flex-shrink:0;border:1px solid #5e6049;border-radius:4px}#dialogo h2{margin:0 0 8px}#dialogo p{line-height:1.5;margin-bottom:12px}#dialogo small{display:block;color:#c6b77f;margin-bottom:8px}@media(max-width:700px){header{height:120px;padding:12px;align-items:flex-start;flex-direction:column}h1{font-size:14px}.area,#galeria{height:calc(100dvh - 120px)}nav{gap:4px}nav button{font-size:12px;padding:6px 8px}#aviso{display:none}.rodape{bottom:10px;width:max-content}.rodape button{padding:5px;font-size:11px}.hud{left:10px;top:10px;padding:10px}#retrato{width:84px;height:84px}}
.ferramentas{position:absolute;left:22px;top:112px;display:flex;flex-direction:column;align-items:start;gap:6px;padding:10px;background:#17241fe8;border:1px solid #6b70524d;border-radius:6px}.ferramentas button,.ferramentas select{font:inherit;font-size:12px;padding:6px 9px;color:#e6d6ad;background:#303e33;border:1px solid #64715b;border-radius:4px}.ferramentas label{font-size:12px}.ferramentas button[aria-pressed=true]{background:#d0ac71;color:#202a24}@media(max-width:700px){.ferramentas{left:10px;top:95px;gap:4px;padding:6px}.ferramentas button,.ferramentas select{font-size:11px}}
</style></head><body>
<header><div><h1>DEPOIS DA QUEDA <span class="etiqueta">OFICINA DE ARTE</span></h1><p>Sprites reais e o mesmo motor do jogo · teste local sem salvar progresso</p></div><nav aria-label="Prévia"><button data-aba="abrigo" aria-pressed="true">Testar no abrigo</button><button data-aba="personagens">Personagens</button><button data-aba="icones">Ícones</button><button data-aba="cenario">Cenário</button></nav></header>
<section id="abrigo" class="area"><canvas id="cena" tabindex="0" aria-label="Abrigo para testar a arte. WASD ou setas para andar; E para conversar."></canvas><div class="hud"><b>UNIÃO DA MARGEM</b><span>WASD / setas · mover &nbsp; E · conversar &nbsp; roda · zoom</span></div><aside class="ferramentas" aria-label="Teste visual"><button id="visao-abrigo" aria-pressed="false">Visão do abrigo</button><button id="seguir-jogador" aria-pressed="true">Acompanhar jogador</button><label for="roupa-jogador">Roupa do jogador</label><select id="roupa-jogador"><option value="sobrevivente_jaqueta">Jaqueta</option><option value="sobrevivente_moletom">Moletom</option><option value="sobrevivente_colete">Colete</option><option value="sobrevivente_macacao">Macacão</option></select></aside><div id="aviso" role="status">Clique no chão para caminhar. Os retratos aparecem ao conversar com os NPCs.</div><div class="rodape"><button data-destino="prefeito"><img src="assets/icones/armazem.png" alt="">Prefeito</button><button data-destino="wolf"><img src="assets/icones/reparar.png" alt="">Wolf</button><button data-destino="bashar"><img src="assets/icones/bipe.png" alt="">Bashar</button></div><div id="dialogo" hidden><canvas id="retrato" width="256" height="256"></canvas><div><h2 id="dn"></h2><small id="dp"></small><p id="df"></p><button id="fechar">Voltar ao abrigo · Esc</button></div></div></section>
<section id="galeria" hidden><h2 id="titulo-galeria"></h2><div id="conteudo" class="grid"></div></section>
<script src="mundo.js"></script><script src="arte.js"></script><script src="arte-v2.js"></script><script src="abrigo-refino.js"></script><script src="objetos-pixel.js"></script><script src="cenario-detalhes.js"></script><script src="motor.js"></script><script src="oficina-arte.js"></script>
</body></html>
